name: build-switch

on:
  push:
  workflow_dispatch:

jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib for Switch
        run: dkp-pacman -S --noconfirm --needed switch-zlib
      - name: Build NRO
        run: make -j"$(nproc)"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegramnx-nro
          path: build_switch/telegramnx.nro
